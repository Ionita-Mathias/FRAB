name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: codegen · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json. Specifying both makes it fail with "Multiple versions of
      # pnpm specified", so package.json stays the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated protobuf bindings are NOT committed — regenerate from the
      # .proto so CI proves the schema and the checked-in code agree.
      - name: Generate protobuf bindings
        run: pnpm codegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The golden vectors pin the wire format across TS/Swift/Kotlin. If a
      # change rewrites them, that is a breaking protocol change and must be a
      # deliberate, reviewed commit — never an incidental diff.
      - name: Assert golden vectors unchanged
        run: git diff --exit-code -- packages/protocol/test/golden-vectors.json
